name: macos
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure (Universal, macOS 12.0+)
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
      - name: Build
        # errors go to annotations too: they are public, the full job log needs a token
        run: |
          set -o pipefail
          cmake --build build --config Release 2>&1 | tee build.log || {
            # the 20 lines before the first error name the source file and its include chain
            n=$(grep -n -m1 -E "error:|Undefined symbols" build.log | cut -d: -f1 || echo 1)
            # GitHub keeps at most 10 error annotations per step, so the context is one annotation
            echo "::error::ctx%0A$(sed -n "$(( n > 20 ? n - 20 : 1 )),${n}p" build.log | cut -c1-600 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            grep -E "error:|fatal error|Undefined symbols|ld: " build.log | sort -u | head -8 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Pack
        run: cd build && ditto -c -k --keepParent "$(find . -name 'PejededStudio.app' -path '*Release*' | head -1)" PejededStudio-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PejededStudio-macos
          path: build/PejededStudio-macos.zip
